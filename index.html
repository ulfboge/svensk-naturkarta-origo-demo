<!DOCTYPE html>
<!--
  index.html — Svensk Naturkarta
  ──────────────────────────────
  This file runs without any build tool.
  Serve the project root with any static server:

    npx serve .                 (recommended — zero install needed)
    npx http-server . -p 3000   (alternative)
    python -m http.server 3000  (if you have Python)

  Load order:
    1. Origo CSS    — framework styles from public/origo/
    2. Custom CSS   — our green-theme overrides
    3. origo.min.js — registers the global Origo() function
    4. main.js      — calls Origo('/config/origo.json')
-->
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Naturkarta — kartvisare för skyddad natur och skogsdata" />
    <meta name="theme-color" content="#2d6a4f" />
    <title>Naturkarta — Skyddad natur och skog</title>

    <!-- Origo's own CSS (controls, popups, layer switcher) -->
    <link rel="stylesheet" href="origo/css/style.css" />

    <!-- Our green-theme overrides -->
    <link rel="stylesheet" href="src/style.css" />
  </head>

  <body>
    <!-- Origo mounts the map into this div -->
    <div id="app-wrapper"></div>

    <!-- Origo browser bundle — sets the global Origo() function -->
    <script src="origo/js/origo.min.js"></script>

    <!-- Our entry script -->
    <script src="src/main.js"></script>
  </body>
</html>
