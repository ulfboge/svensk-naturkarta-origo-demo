<!DOCTYPE html>
<!--
  public/index.html — Naturkarta entry point
  ──────────────────────────────────────────
  Serve this directory with any static file server:

    python -m http.server 3000 --directory public
    (then open http://localhost:3000)

  File layout required by Origo (paths are root-relative from public/):
    css/         ← Origo's CSS + SVG sprites  (MUST be at root, not origo/css/)
    js/          ← origo.min.js               (MUST be at root, not origo/js/)
    img/         ← Origo's images             (MUST be at root, not origo/img/)
    config/      ← origo.json config
    data/        ← GeoJSON data files
    src/         ← our custom CSS overrides
-->
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Naturkarta — skyddade naturområden i Stockholms län. Naturreservat och nationalparker med klickbar information.">
  <meta name="theme-color" content="#2d6a4f">
  <title>Naturkarta — Skyddad natur i Stockholms län</title>

  <!-- Origo framework CSS (controls, popups, layer legend panel) -->
  <link href="css/style.css" rel="stylesheet">

  <!-- Our minimal green-theme overrides — loaded after Origo CSS -->
  <link href="src/style.css" rel="stylesheet">
</head>
<body>

<!-- Map title + county selector overlay -->
<div id="map-title">
  <span>Skyddad natur i Sverige</span>
  <div id="county-selector">
    <select id="county-select">
      <option value="">Välj ett län…</option>
      <option value="all">— Hela Sverige —</option>
      <option value="ble">Blekinge län</option>
      <option value="dal">Dalarnas län</option>
      <option value="gav">Gävleborgs län</option>
      <option value="got">Gotlands län</option>
      <option value="hal">Hallands län</option>
      <option value="jam">Jämtlands län</option>
      <option value="jon">Jönköpings län</option>
      <option value="kal">Kalmar län</option>
      <option value="kro">Kronobergs län</option>
      <option value="nrb">Norrbottens län</option>
      <option value="ore">Örebro län</option>
      <option value="ost">Östergötlands län</option>
      <option value="skane">Skåne län</option>
      <option value="sod">Södermanlands län</option>
      <option value="sthlm">Stockholms län</option>
      <option value="upp">Uppsala län</option>
      <option value="vbo">Västerbottens län</option>
      <option value="vg">Västra Götalands län</option>
      <option value="vml">Västmanlands län</option>
      <option value="vnr">Västernorrlands län</option>
      <option value="vrm">Värmlands län</option>
    </select>
  </div>
  <div id="reservat-search-wrap">
    <input id="reservat-search" type="search" list="reservat-names" placeholder="Sök reservat…" autocomplete="off">
    <datalist id="reservat-names"></datalist>
  </div>
</div>

<!-- Statistics panel — bottom-right, extensible with future data sources -->
<div id="stats-panel">
  <div class="stats-header" id="stats-county">Alla fyra länen</div>
  <div class="stats-section" id="stats-nature">
    <div class="stats-section-title">Skyddad natur</div>
    <div class="stats-row">
      <span class="stats-label">Naturreservat</span>
      <span class="stats-value" id="stats-nr-count">—</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Total areal</span>
      <span class="stats-value" id="stats-nr-area">—</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Nationalparker</span>
      <span class="stats-value" id="stats-np-count">—</span>
    </div>
  </div>
  <div class="stats-section" id="stats-artobs">
    <div class="stats-section-title">Artobservationer (GBIF)</div>
    <div class="stats-row">
      <span class="stats-label">2020–2025</span>
      <span class="stats-value" id="stats-gbif-count">—</span>
    </div>
    <div class="stats-row stats-row-link">
      <a id="stats-gbif-link" href="https://www.gbif.org/occurrence/map?country=SE" target="_blank">GBIF ↗</a>
      <a id="stats-ap-link" href="https://www.artportalen.se/ViewSighting/SearchSighting" target="_blank" style="margin-left:8px">Artportalen ↗</a>
    </div>
  </div>
  <div class="stats-section" id="stats-planning">
    <div class="stats-section-title">Planering</div>
    <div class="stats-row stats-row-link">
      <a id="stats-riksintresse-link" href="https://www.boverket.se/sv/PBL-kunskapsbanken/riksintressen/kartor/" target="_blank">Riksintressekarta ↗</a>
      <a href="https://www.naturvardsverket.se/amnesomraden/skyddad-natur/" target="_blank" style="margin-left:8px">NV Ärenden ↗</a>
    </div>
  </div>
  <div class="stats-section" id="stats-hunting">
    <div class="stats-section-title">Jakt &amp; tillträde</div>
    <div class="stats-row stats-row-link">
      <a href="https://www.naturvardsverket.se/amnesomraden/jakt-och-vilt/jakttider/" target="_blank">Jakttider på NV ↗</a>
    </div>
  </div>
  <div class="stats-section" id="stats-weather">
    <div class="stats-section-title">Aktuellt väder</div>
    <div class="stats-row">
      <span class="stats-label">Temperatur</span>
      <span class="stats-value" id="stats-smhi-temp">—</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Väder</span>
      <span class="stats-value" id="stats-smhi-desc">—</span>
    </div>
    <div class="stats-row stats-row-link">
      <a id="stats-smhi-link" href="https://www.smhi.se/vader/prognoser/ortsvyer" target="_blank">SMHI prognos ↗</a>
    </div>
  </div>
</div>

<!-- #app-wrapper MUST be completely empty — Origo fills it entirely -->
<div id="app-wrapper"></div>

<!-- Origo UMD bundle — registers the global Origo() function -->
<script src="js/origo.min.js"></script>

<!-- Initialise the map -->
<script type="text/javascript">
  var viewer = Origo('config/origo.json');
  window.viewer = viewer;

  // ── GBIF / Artdatabanken helpers ──────────────────────────────────────────

  // Exact WGS84 bboxes per county (derived from actual GeoJSON extents)
  var COUNTY_BBOX = {
    sthlm: { minLat: 58.766, maxLat: 60.228, minLon: 17.333, maxLon: 19.916 },
    sod:   { minLat: 58.612, maxLat: 59.514, minLon: 15.704, maxLon: 17.789 },
    upp:   { minLat: 59.398, maxLat: 60.705, minLon: 16.735, maxLon: 18.952 },
    ost:   { minLat: 57.705, maxLat: 58.983, minLon: 14.543, maxLon: 17.209 },
    vg:    { minLat: 57.146, maxLat: 59.252, minLon: 10.942, maxLon: 14.716 },
    skane: { minLat: 55.269, maxLat: 56.557, minLon: 12.117, maxLon: 14.577 },
    ble:   { minLat: 55.911, maxLat: 56.447, minLon: 14.404, maxLon: 16.046 },
    dal:   { minLat: 59.885, maxLat: 62.284, minLon: 12.297, maxLon: 16.678 },
    got:   { minLat: 56.938, maxLat: 58.584, minLon: 17.912, maxLon: 19.572 },
    gav:   { minLat: 60.227, maxLat: 62.294, minLon: 14.524, maxLon: 17.676 },
    hal:   { minLat: 56.301, maxLat: 57.597, minLon: 11.958, maxLon: 13.671 },
    jam:   { minLat: 61.614, maxLat: 65.110, minLon: 12.223, maxLon: 16.824 },
    jon:   { minLat: 56.893, maxLat: 58.117, minLon: 13.089, maxLon: 15.644 },
    kal:   { minLat: 56.098, maxLat: 58.118, minLon: 15.501, maxLon: 17.572 },
    kro:   { minLat: 56.361, maxLat: 57.222, minLon: 13.368, maxLon: 15.838 },
    nrb:   { minLat: 65.204, maxLat: 68.178, minLon: 16.073, maxLon: 25.086 },
    vrm:   { minLat: 58.698, maxLat: 61.073, minLon: 11.811, maxLon: 14.372 },
    vbo:   { minLat: 63.399, maxLat: 66.184, minLon: 14.537, maxLon: 22.077 },
    vnr:   { minLat: 62.156, maxLat: 63.976, minLon: 14.802, maxLon: 19.227 },
    vml:   { minLat: 59.262, maxLat: 60.169, minLon: 15.454, maxLon: 17.005 },
    ore:   { minLat: 58.685, maxLat: 60.077, minLon: 14.304, maxLon: 15.727 },
    all:   { minLat: 55.269, maxLat: 68.178, minLon: 10.942, maxLon: 25.086 }
  };

  // Artportalen länskoder
  var COUNTY_AP_CODE = {
    sthlm: 'AB', sod: 'D',  upp: 'C',  ost: 'E',  vg: 'O',  skane: 'M',
    ble:   'K',  dal: 'W',  got: 'I',  gav: 'X',  hal: 'N',
    jam:   'Z',  jon: 'F',  kal: 'H',  kro: 'G',  nrb: 'BD',
    vrm:   'S',  vbo: 'AC', vnr: 'Y',  vml: 'U',  ore: 'T',
    all: null
  };

  function artportalenUrl(county) {
    var code = COUNTY_AP_CODE[county];
    var base = 'https://www.artportalen.se/ViewSighting/SearchSighting';
    return code ? base + '?countyId=' + code : base;
  }

  // Convert EPSG:3857 extent → WGS84 bbox object
  function extentToWGS84(ext) {
    var R = 20037508.34;
    function lon(x) { return x * 180 / R; }
    function lat(y) { return Math.atan(Math.exp(y * Math.PI / R)) * 360 / Math.PI - 90; }
    return {
      minLat: lat(ext[1]).toFixed(4), maxLat: lat(ext[3]).toFixed(4),
      minLon: lon(ext[0]).toFixed(4), maxLon: lon(ext[2]).toFixed(4)
    };
  }

  function gbifUrl(bbox) {
    return 'https://api.gbif.org/v1/occurrence/search?country=SE'
      + '&decimalLatitude='  + bbox.minLat + ',' + bbox.maxLat
      + '&decimalLongitude=' + bbox.minLon + ',' + bbox.maxLon
      + '&year=2020,2025&limit=0';
  }

  function gbifMapUrl(bbox) {
    return 'https://www.gbif.org/occurrence/map?country=SE'
      + '&decimalLatitude='  + bbox.minLat + ',' + bbox.maxLat
      + '&decimalLongitude=' + bbox.minLon + ',' + bbox.maxLon;
  }

  function fmtCount(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.', ',') + ' milj.';
    return n.toLocaleString('sv-SE') + ' st';
  }

  // WMO weather codes → svensk text (Open-Meteo / ECMWF)
  var WMO_SV = {
    0:'Klart', 1:'Mestadels klart', 2:'Delvis molnigt', 3:'Mulet',
    45:'Dimma', 48:'Isfrimma',
    51:'Lätt duggregn', 53:'Duggregn', 55:'Kraftigt duggregn',
    61:'Lätt regn', 63:'Regn', 65:'Kraftigt regn',
    71:'Lätt snöfall', 73:'Snöfall', 75:'Kraftigt snöfall', 77:'Kornsnö',
    80:'Lätt regnskur', 81:'Regnskur', 82:'Kraftig regnskur',
    85:'Lätt snöskur', 86:'Kraftig snöskur',
    95:'Åska', 96:'Åska med hagel', 99:'Åska med kraftigt hagel'
  };

  function fetchWeather(lon, lat, callback) {
    var url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + lat.toFixed(4) + '&longitude=' + lon.toFixed(4)
      + '&current_weather=true';
    fetch(url)
      .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function(d) {
        if (!d || !d.current_weather) { callback(null); return; }
        var cw = d.current_weather;
        callback({ t: cw.temperature, wsymb: cw.weathercode });
      })
      .catch(function() { callback(null); });
  }

  // ── County stats: SMHI väder ─────────────────────────────────────────────

  function updateSMHIStats(county) {
    var tempEl = document.getElementById('stats-smhi-temp');
    var descEl = document.getElementById('stats-smhi-desc');
    if (!tempEl) return;
    if (county === 'all' || !COUNTY_CENTER[county]) {
      tempEl.textContent = '—';
      if (descEl) descEl.textContent = 'Välj ett län';
      return;
    }
    var center = COUNTY_CENTER[county];
    tempEl.textContent = 'hämtar…';
    if (descEl) descEl.textContent = '';
    fetchWeather(center.lon, center.lat, function(data) {
      if (!data) { tempEl.textContent = '—'; return; }
      tempEl.textContent = data.t !== null ? data.t.toFixed(1) + ' °C' : '—';
      if (descEl) descEl.textContent = data.wsymb ? (WMO_SV[data.wsymb] || '') : '';
    });
  }

  // ── County stats: artobservationer ───────────────────────────────────────

  function updateArtobsStats(county) {
    var countEl = document.getElementById('stats-gbif-count');
    var gbifEl  = document.getElementById('stats-gbif-link');
    var apEl    = document.getElementById('stats-ap-link');
    var bbox    = COUNTY_BBOX[county];
    if (!bbox) return;

    countEl.textContent = 'hämtar…';
    gbifEl.href = gbifMapUrl(bbox);
    if (apEl) apEl.href = artportalenUrl(county);

    fetch(gbifUrl(bbox))
      .then(function(r) { return r.json(); })
      .then(function(d) { countEl.textContent = fmtCount(d.count || 0); })
      .catch(function()  { countEl.textContent = '—'; });
  }

  // ── Popup: artobservationer per klickat reservat ──────────────────────────

  var COUNTY_LAYER_SUFFIX = {
    sthlm: 'sthlm',        sod:  'sod',           upp:  'uppsala',
    ost:   'ostergotland', vg:   'vastragotaland', skane:'skane',
    ble:   'blekinge',     dal:  'dalarna',        got:  'gotland',
    gav:   'gavleborg',    hal:  'halland',        jam:  'jamtland',
    jon:   'jonkoping',    kal:  'kalmar',         kro:  'kronoberg',
    nrb:   'norrbotten',   vrm:  'varmland',       vbo:  'vasterbotten',
    vnr:   'vasternorrland', vml:'vastmanland',    ore:  'orebro'
  };

  var lastClickBbox      = null;
  var lastClickAPCode    = null;
  var lastClickCentroid  = null;
  var lastClickNVRID     = null;

  var LAYER_AP_CODE = (function() {
    var m = {};
    Object.keys(COUNTY_LAYER_SUFFIX).forEach(function(c) {
      m['nv_naturreservat_' + COUNTY_LAYER_SUFFIX[c]] = COUNTY_AP_CODE[c] || null;
    });
    return m;
  }());

  function apUrlForPopup(apCode) {
    var base = 'https://www.artportalen.se/ViewSighting/SearchSighting';
    return apCode ? base + '?countyId=' + apCode : base;
  }

  function initArtobs() {
    var map = viewer.api().getMap();

    // Capture bbox, centroid, county and NVRID of clicked NR/NP feature
    map.on('singleclick', function(evt) {
      lastClickBbox     = null;
      lastClickAPCode   = null;
      lastClickCentroid = null;
      lastClickNVRID    = null;
      map.forEachFeatureAtPixel(evt.pixel, function(f, layer) {
        if (!layer) return;
        var n = layer.get('name') || '';
        if (n.indexOf('nv_naturreservat') === -1 && n.indexOf('nv_nationalparker') === -1) return;
        var ext = f.getGeometry().getExtent();
        lastClickBbox   = extentToWGS84(ext);
        lastClickAPCode = LAYER_AP_CODE[n] || null;
        lastClickNVRID  = f.get('NVRID') || null;
        var R = 20037508.34;
        var cx = (ext[0] + ext[2]) / 2;
        var cy = (ext[1] + ext[3]) / 2;
        lastClickCentroid = {
          lon: cx * 180 / R,
          lat: Math.atan(Math.exp(cy * Math.PI / R)) * 360 / Math.PI - 90
        };
        return true;
      });
    });

    // Inject Artobs row into popup when it opens
    new MutationObserver(function(muts) {
      muts.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (node.nodeType !== 1) return;
          var targets = [];
          if (node.classList && node.classList.contains('o-identify-content')) {
            targets = [node];
          } else if (node.querySelectorAll) {
            targets = Array.from(node.querySelectorAll('.o-identify-content'));
          }
          targets.forEach(function(el) {
            if (el.dataset.artobs || !lastClickBbox) return;
            el.dataset.artobs = '1';
            var bbox     = lastClickBbox;
            var centroid = lastClickCentroid;
            var nvrid    = lastClickNVRID;
            var apCode   = lastClickAPCode;

            var li = document.createElement('li');
            li.innerHTML = '<b>Artobservationer</b>: <span class="artobs-loading">hämtar…</span>';
            el.appendChild(li);

            var liSmhi = document.createElement('li');
            liSmhi.innerHTML = '<b>Väder nu</b>: <span class="smhi-loading">hämtar…</span>';
            el.appendChild(liSmhi);

            // GBIF + Artportalen djuplänk (NVRID som area-filter)
            fetch(gbifUrl(bbox))
              .then(function(r) { return r.json(); })
              .then(function(d) {
                var count = fmtCount(d.count || 0);
                var apBase = 'https://www.artportalen.se/ViewSighting/SearchSighting';
                var apUrl  = nvrid
                  ? apBase + '?areaId=' + nvrid + (apCode ? '&countyId=' + apCode : '')
                  : apUrlForPopup(apCode);
                li.innerHTML = '<b>Artobservationer</b>: ' + count + ' (2020–2025)<br>'
                  + '<a href="' + gbifMapUrl(bbox) + '" target="_blank">GBIF ↗</a>'
                  + ' &nbsp;<a href="' + apUrl + '" target="_blank">Artportalen ↗</a>';
                var liPlan = document.createElement('li');
                liPlan.innerHTML = '<b>Planering</b><br>'
                  + '<a href="https://www.boverket.se/sv/PBL-kunskapsbanken/riksintressen/kartor/" target="_blank">Riksintressen (Boverket) ↗</a>'
                  + ' &nbsp;<a href="https://www.naturvardsverket.se/amnesomraden/skyddad-natur/" target="_blank">NV Ärenden ↗</a>';
                el.appendChild(liPlan);
              })
              .catch(function() {
                li.querySelector('.artobs-loading').textContent = '—';
              });

            // SMHI punktprognos för reservatets centroid
            if (centroid) {
              fetchWeather(centroid.lon, centroid.lat, function(data) {
                if (!data) { liSmhi.querySelector('.smhi-loading').textContent = '—'; return; }
                var tempStr = data.t !== null ? data.t.toFixed(1) + ' °C' : '—';
                var descStr = data.wsymb ? (WMO_SV[data.wsymb] || '') : '';
                liSmhi.innerHTML = '<b>Väder nu</b>: ' + tempStr
                  + (descStr ? ', ' + descStr : '');
              });
            } else {
              el.removeChild(liSmhi);
            }
          });
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  // County center coordinates (WGS84) for SMHI API — midpoints of COUNTY_BBOX
  var COUNTY_CENTER = {
    sthlm: { lat: 59.50, lon: 18.62 }, sod:   { lat: 59.06, lon: 16.75 },
    upp:   { lat: 60.05, lon: 17.84 }, ost:   { lat: 58.34, lon: 15.88 },
    vg:    { lat: 58.20, lon: 12.83 }, skane: { lat: 55.91, lon: 13.35 },
    ble:   { lat: 56.18, lon: 15.22 }, dal:   { lat: 61.08, lon: 14.49 },
    got:   { lat: 57.76, lon: 18.74 }, gav:   { lat: 61.26, lon: 16.10 },
    hal:   { lat: 56.95, lon: 12.81 }, jam:   { lat: 63.36, lon: 14.52 },
    jon:   { lat: 57.51, lon: 14.37 }, kal:   { lat: 57.11, lon: 16.54 },
    kro:   { lat: 56.79, lon: 14.60 }, nrb:   { lat: 66.69, lon: 20.58 },
    vrm:   { lat: 59.89, lon: 13.09 }, vbo:   { lat: 64.79, lon: 18.31 },
    vnr:   { lat: 63.07, lon: 17.01 }, vml:   { lat: 59.72, lon: 16.23 },
    ore:   { lat: 59.38, lon: 15.02 }, all:   { lat: 62.00, lon: 15.00 }
  };

  // County display names for stats panel
  var COUNTY_NAMES = {
    sthlm: 'Stockholms län',    sod:  'Södermanlands län',
    upp:   'Uppsala län',       ost:  'Östergötlands län',
    vg:    'Västra Götalands län', skane: 'Skåne län',
    ble:   'Blekinge län',      dal:  'Dalarnas län',
    got:   'Gotlands län',      gav:  'Gävleborgs län',
    hal:   'Hallands län',      jam:  'Jämtlands län',
    jon:   'Jönköpings län',    kal:  'Kalmar län',
    kro:   'Kronobergs län',    nrb:  'Norrbottens län',
    vrm:   'Värmlands län',     vbo:  'Västerbottens län',
    vnr:   'Västernorrlands län', vml: 'Västmanlands län',
    ore:   'Örebro län',
    all:   'Hela Sverige'
  };

  // Pre-calculated stats — counts and areas from GeoJSON files.
  var COUNTY_STATS = {
    sthlm: { nr:  383, area:   189182, np:  3 },
    sod:   { nr:  196, area:    52371, np:  0 },
    upp:   { nr:  201, area:   109518, np:  1 },
    ost:   { nr:  329, area:    67253, np:  0 },
    vg:    { nr:  545, area:   162741, np:  4 },
    skane: { nr:  391, area:   161528, np:  3 },
    ble:   { nr:  126, area:    39023, np:  0 },
    dal:   { nr:  420, area:   263362, np:  5 },
    got:   { nr:  165, area:    82583, np:  2 },
    gav:   { nr:  252, area:    61804, np:  1 },
    hal:   { nr:  212, area:    29768, np:  1 },
    jam:   { nr:  270, area:   638883, np:  4 },
    jon:   { nr:  186, area:    21081, np:  2 },
    kal:   { nr:  214, area:   103609, np:  2 },
    kro:   { nr:  154, area:    28688, np:  0 },
    nrb:   { nr:  529, area:  2169238, np:  7 },
    vrm:   { nr:  243, area:   118015, np:  0 },
    vbo:   { nr:  476, area:  1180754, np:  2 },
    vnr:   { nr:  239, area:    53407, np:  1 },
    vml:   { nr:  138, area:    34065, np:  0 },
    ore:   { nr:  324, area:    38820, np:  1 },
    all:   { nr: 5993, area:  5656695, np: 30 }
  };

  function updateStats(county) {
    var s = COUNTY_STATS[county];
    if (!s) return;
    document.getElementById('stats-county').textContent   = COUNTY_NAMES[county] || county;
    document.getElementById('stats-nr-count').textContent = s.nr.toLocaleString('sv-SE') + ' st';
    document.getElementById('stats-nr-area').textContent  = s.area.toLocaleString('sv-SE') + ' ha';
    document.getElementById('stats-np-count').textContent = s.np + ' st';
  }

  // County extents in EPSG:3857 [minX, minY, maxX, maxY]
  var EXTENTS = {
    sthlm: [1903563, 8094429, 2237522, 8489337],
    sod:   [1714320, 8051819, 2003751, 8333247],
    upp:   [1831000, 8350000, 2226000, 8726000],
    ost:   [1629000, 7920000, 2003000, 8228000],
    vg:    [1224000, 7640000, 1762000, 8300000],
    skane: [1380000, 7340000, 1665000, 7680000],
    ble:   [1603473, 7540745, 1786200, 7647889],
    dal:   [1368935, 8374198, 1856580, 8926709],
    got:   [1993984, 7747416, 2178765, 8091027],
    gav:   [1616823, 8450354, 1967733, 8929093],
    hal:   [1331194, 7618630, 1521843, 7883063],
    jam:   [1360610, 8768160, 1872825, 9637306],
    jon:   [1457079, 7738210, 1741459, 7991997],
    kal:   [1725534, 7578007, 1956118, 7992234],
    kro:   [1488080, 7630662, 1763117, 7805550],
    nrb:   [1789246, 9662415, 2792526, 10500026],
    vrm:   [1314785, 8115330, 1599862, 8642708],
    vbo:   [1618203, 9198647, 2457651, 9927487],
    vnr:   [1647696, 8896201, 2140362, 9343666],
    vml:   [1720351, 8237248, 1892939, 8437451],
    ore:   [1592309, 8112528, 1750777, 8417005],
    all:   [1180000, 7320000, 2800000, 10520000]
  };

  var ALL_NR = Object.keys(COUNTY_LAYER_SUFFIX).map(function(c) {
    return 'nv_naturreservat_' + COUNTY_LAYER_SUFFIX[c];
  });
  var ALL_LAYERS = ALL_NR.concat(['nv_nationalparker']);

  // Layers to show/hide per county — NP always shown
  var COUNTY_LAYERS = (function() {
    var cfg = {};
    Object.keys(COUNTY_LAYER_SUFFIX).forEach(function(c) {
      var nr = 'nv_naturreservat_' + COUNTY_LAYER_SUFFIX[c];
      cfg[c] = {
        show: [nr, 'nv_nationalparker'],
        hide: ALL_NR.filter(function(l) { return l !== nr; })
      };
    });
    cfg.all = { show: ALL_LAYERS, hide: [] };
    return cfg;
  }());

  function findOLLayer(name) {
    var map = null;
    try { map = viewer.api().getMap(); } catch (e) {}
    if (!map) return null;
    function search(group) {
      var arr = group.getLayers().getArray();
      for (var i = 0; i < arr.length; i++) {
        var l = arr[i];
        if (l.get('name') === name) return l;
        if (typeof l.getLayers === 'function') {
          var hit = search(l); if (hit) return hit;
        }
      }
      return null;
    }
    return search(map.getLayerGroup());
  }

  function selectCounty(county) {
    var map = null;
    try { map = viewer.api().getMap(); } catch (e) {}
    if (!map) return;
    var cfg = COUNTY_LAYERS[county];
    if (!cfg) return;
    cfg.show.forEach(function(n) {
      var l = findOLLayer(n); if (l) l.setVisible(true);
    });
    cfg.hide.forEach(function(n) {
      var l = findOLLayer(n); if (l) l.setVisible(false);
    });
    try {
      map.getView().fit(EXTENTS[county], { padding: [60, 60, 60, 60], duration: 600 });
    } catch (e) { /* fit kan misslyckas om kartan inte renderats klart */ }
    var sel = document.getElementById('county-select');
    if (sel) sel.value = county;
    updateStats(county);
    updateArtobsStats(county);
    updateSMHIStats(county);
    rebuildSearch(county);
  }

  // Wait until Origo is ready, then wire up dropdown and set initial state
  function initSelector() {
    var map = null;
    try { map = viewer.api().getMap(); } catch (e) {}
    if (!map) { setTimeout(initSelector, 200); return; }

    // Initial state B: only NP layer visible, zoom to all of Sweden
    ALL_NR.forEach(function(n) {
      var l = findOLLayer(n); if (l) l.setVisible(false);
    });
    var npLayer = findOLLayer('nv_nationalparker');
    if (npLayer) npLayer.setVisible(true);
    try {
      map.getView().fit(EXTENTS.all, { padding: [60, 60, 60, 60], duration: 800 });
    } catch(e) {}

    document.getElementById('county-select').addEventListener('change', function() {
      if (this.value) selectCounty(this.value);
    });

    initSearch();
    updateStats('all');
    updateArtobsStats('all');
    updateSMHIStats('all');
    initArtobs();
  }
  setTimeout(initSelector, 600);

  // Layer names per county (used by search)
  var COUNTY_LAYER_NAME = (function() {
    var m = {};
    Object.keys(COUNTY_LAYER_SUFFIX).forEach(function(c) {
      m[c] = 'nv_naturreservat_' + COUNTY_LAYER_SUFFIX[c];
    });
    return m;
  }());

  var searchIndex = {};   // module-level so event handler always reads latest version

  // Rebuild search datalist filtered to the selected county.
  // Handles lazy-loading: hidden layers have no features until made visible,
  // so we listen for featuresloadend when the source is empty.
  function rebuildSearch(county) {
    var layerNames = county === 'all'
        ? Object.keys(COUNTY_LAYER_NAME).map(function(k) { return COUNTY_LAYER_NAME[k]; })
        : (COUNTY_LAYER_NAME[county] ? [COUNTY_LAYER_NAME[county]] : []);

    var newIndex = {};
    var pending = 0;

    function finish() {
      searchIndex = newIndex;
      var dl = document.getElementById('reservat-names');
      dl.innerHTML = '';
      Object.keys(newIndex).sort().forEach(function(n) {
        var opt = document.createElement('option');
        opt.value = n;
        dl.appendChild(opt);
      });
    }

    layerNames.forEach(function(lName) {
      var l = findOLLayer(lName);
      if (!l || !l.getSource) return;
      var src = l.getSource();

      function harvest() {
        src.getFeatures().forEach(function(f) {
          var n = f.get('NAMN');
          if (n && !newIndex[n]) newIndex[n] = { feature: f, layerName: lName };
        });
      }

      if (src.getFeatures().length > 0) {
        harvest();
      } else {
        pending++;
        src.once('featuresloadend', function() {
          harvest();
          pending--;
          if (pending === 0) finish();
        });
      }
    });

    if (pending === 0) finish();
  }

  function initSearch() {
    rebuildSearch('all');

    document.getElementById('reservat-search').addEventListener('change', function() {
      var match = searchIndex[this.value];
      if (!match) return;
      // Make sure the matching layer is visible
      var l = findOLLayer(match.layerName);
      if (l && !l.getVisible()) l.setVisible(true);
      var geom = match.feature.getGeometry();
      if (!geom) { this.value = ''; return; }
      viewer.api().getMap().getView().fit(geom.getExtent(), {
        padding: [100, 80, 80, 80],
        duration: 600,
        maxZoom: 13
      });
      this.blur();
      var inp = this;
      setTimeout(function() { inp.value = ''; }, 400);
    });
  }

  // Format AREA_HA with Swedish thousands separator when Origo renders a popup
  (function () {
    function fmtLi(li) {
      var b = li.querySelector('b');
      if (!b || b.textContent.trim() !== 'Areal (ha)') return;
      li.childNodes.forEach(function (n) {
        if (n.nodeType !== 3) return;
        var num = parseFloat(n.textContent.replace(/[^\d.]/g, ''));
        if (!isNaN(num)) n.textContent = ': ' + Math.round(num).toLocaleString('sv-SE') + ' ha';
      });
    }
    function scan(node) {
      if (node.matches && node.matches('li')) fmtLi(node);
      if (node.querySelectorAll) node.querySelectorAll('li').forEach(fmtLi);
    }
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }());
</script>
