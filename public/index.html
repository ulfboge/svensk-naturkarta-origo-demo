<!DOCTYPE html>
<!--
  public/index.html — Naturkarta entry point
  ──────────────────────────────────────────
  Serve this directory with any static file server:

    python -m http.server 3000 --directory public
    (then open http://localhost:3000)

  File layout required by Origo (paths are root-relative from public/):
    css/         ← Origo's CSS + SVG sprites  (MUST be at root, not origo/css/)
    js/          ← origo.min.js               (MUST be at root, not origo/js/)
    img/         ← Origo's images             (MUST be at root, not origo/img/)
    config/      ← origo.json config
    data/        ← GeoJSON data files
    src/         ← our custom CSS overrides
-->
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Naturkarta — skyddade naturområden i Stockholms län. Naturreservat och nationalparker med klickbar information.">
  <meta name="theme-color" content="#2d6a4f">
  <title>Naturkarta — Skyddad natur i Stockholms län</title>

  <!-- Origo framework CSS (controls, popups, layer legend panel) -->
  <link href="css/style.css" rel="stylesheet">

  <!-- Our minimal green-theme overrides — loaded after Origo CSS -->
  <link href="src/style.css" rel="stylesheet">
</head>
<body>

<!-- Map title + county selector overlay -->
<div id="map-title">
  <span>Skyddad natur</span>
  <div id="county-selector">
    <button class="county-btn active" data-county="all">Alla</button>
    <button class="county-btn" data-county="sthlm">Stockholm</button>
    <button class="county-btn" data-county="sod">Södermanland</button>
    <button class="county-btn" data-county="upp">Uppsala</button>
    <button class="county-btn" data-county="ost">Östergötland</button>
    <button class="county-btn" data-county="vg">Västra Götaland</button>
    <button class="county-btn" data-county="skane">Skåne</button>
  </div>
  <div id="reservat-search-wrap">
    <input id="reservat-search" type="search" list="reservat-names" placeholder="Sök reservat…" autocomplete="off">
    <datalist id="reservat-names"></datalist>
  </div>
</div>

<!-- Statistics panel — bottom-right, extensible with future data sources -->
<div id="stats-panel">
  <div class="stats-header" id="stats-county">Alla fyra länen</div>
  <div class="stats-section" id="stats-nature">
    <div class="stats-section-title">Skyddad natur</div>
    <div class="stats-row">
      <span class="stats-label">Naturreservat</span>
      <span class="stats-value" id="stats-nr-count">—</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Total areal</span>
      <span class="stats-value" id="stats-nr-area">—</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Nationalparker</span>
      <span class="stats-value" id="stats-np-count">—</span>
    </div>
  </div>
  <!-- Framtida sektioner läggs till här:
  <div class="stats-section" id="stats-species">Artobservationer</div>
  <div class="stats-section" id="stats-hunting">Jakttider</div>
  -->
</div>

<!-- #app-wrapper MUST be completely empty — Origo fills it entirely -->
<div id="app-wrapper"></div>

<!-- Origo UMD bundle — registers the global Origo() function -->
<script src="js/origo.min.js"></script>

<!-- Initialise the map -->
<script type="text/javascript">
  var viewer = Origo('config/origo.json');
  window.viewer = viewer;

  // County display names for stats panel
  var COUNTY_NAMES = {
    sthlm: 'Stockholms län',
    sod:   'Södermanlands län',
    upp:   'Uppsala län',
    ost:   'Östergötlands län',
    vg:    'Västra Götalands län',
    skane: 'Skåne län',
    all:   'Alla sex länen'
  };

  // Pre-calculated stats — avoids Origo's lazy-loading issue (hidden layers have no features yet)
  // Counts and areas calculated from GeoJSON files at build time.
  var COUNTY_STATS = {
    sthlm: { nr:  383, area:  189182, np:  3 },
    sod:   { nr:  196, area:   52371, np:  0 },
    upp:   { nr:  201, area:  109518, np:  1 },
    ost:   { nr:  329, area:   67253, np:  0 },
    vg:    { nr:  545, area:  162741, np:  4 },
    skane: { nr:  391, area:  161528, np:  3 },
    all:   { nr: 2045, area:  742593, np: 31 }
  };

  function updateStats(county) {
    var s = COUNTY_STATS[county];
    if (!s) return;
    document.getElementById('stats-county').textContent   = COUNTY_NAMES[county] || county;
    document.getElementById('stats-nr-count').textContent = s.nr.toLocaleString('sv-SE') + ' st';
    document.getElementById('stats-nr-area').textContent  = s.area.toLocaleString('sv-SE') + ' ha';
    document.getElementById('stats-np-count').textContent = s.np + ' st';
  }

  // County extents in EPSG:3857 [minX, minY, maxX, maxY]
  var EXTENTS = {
    sthlm: [1903563, 8094429, 2237522, 8489337],
    sod:   [1714320, 8051819, 2003751, 8333247],
    upp:   [1831000, 8350000, 2226000, 8726000],
    ost:   [1629000, 7920000, 2003000, 8228000],
    vg:    [1224000, 7640000, 1762000, 8300000],
    skane: [1380000, 7340000, 1665000, 7680000],
    all:   [1224000, 7340000, 2237522, 8726000]
  };

  var ALL_NR = ['nv_naturreservat_sthlm', 'nv_naturreservat_sod',
                'nv_naturreservat_uppsala', 'nv_naturreservat_ostergotland',
                'nv_naturreservat_vastragotaland', 'nv_naturreservat_skane'];
  var ALL_LAYERS = ALL_NR.concat(['nv_nationalparker']);

  // Counties WITH national parks (NP layer shown)
  var COUNTIES_WITH_NP = { sthlm: true, upp: true, vg: true, skane: true };

  // Layers to show/hide per county
  var COUNTY_LAYERS = (function() {
    var cfg = {};
    ['sthlm','sod','upp','ost','vg','skane'].forEach(function(c) {
      var nr = 'nv_naturreservat_' + {
        sthlm:'sthlm', sod:'sod', upp:'uppsala', ost:'ostergotland',
        vg:'vastragotaland', skane:'skane'
      }[c];
      var showNP = !!COUNTIES_WITH_NP[c];
      cfg[c] = {
        show: showNP ? [nr, 'nv_nationalparker'] : [nr],
        hide: ALL_NR.filter(function(l) { return l !== nr; })
                    .concat(showNP ? [] : ['nv_nationalparker'])
      };
    });
    cfg.all = { show: ALL_LAYERS, hide: [] };
    return cfg;
  }());

  function findOLLayer(name) {
    var map = viewer.api().getMap();
    if (!map) return null;
    function search(group) {
      var arr = group.getLayers().getArray();
      for (var i = 0; i < arr.length; i++) {
        var l = arr[i];
        if (l.get('name') === name) return l;
        if (typeof l.getLayers === 'function') {
          var hit = search(l); if (hit) return hit;
        }
      }
      return null;
    }
    return search(map.getLayerGroup());
  }

  function selectCounty(county) {
    var map = viewer.api().getMap();
    if (!map) return;
    var cfg = COUNTY_LAYERS[county];
    if (!cfg) return;
    cfg.show.forEach(function(n) {
      var l = findOLLayer(n); if (l) l.setVisible(true);
    });
    cfg.hide.forEach(function(n) {
      var l = findOLLayer(n); if (l) l.setVisible(false);
    });
    try {
      map.getView().fit(EXTENTS[county], { padding: [60, 60, 60, 60], duration: 600 });
    } catch (e) { /* fit kan misslyckas om kartan inte renderats klart */ }
    document.querySelectorAll('.county-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.county === county);
    });
    updateStats(county);
    rebuildSearch(county);
  }

  // Wait until Origo is ready AND the GeoJSON layers exist in the map
  function initSelector() {
    var map = viewer.api && viewer.api().getMap && viewer.api().getMap();
    if (!map) { setTimeout(initSelector, 200); return; }
    if (!findOLLayer('nv_naturreservat_sthlm') && !findOLLayer('nv_naturreservat_sod')) { setTimeout(initSelector, 200); return; }
    document.querySelectorAll('.county-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { selectCounty(btn.dataset.county); });
    });
    initSearch();
    updateStats('all');
  }
  setTimeout(initSelector, 600);

  // Layer names per county (used by search to know which layer to query)
  var COUNTY_LAYER_NAME = {
    sthlm: 'nv_naturreservat_sthlm',
    sod:   'nv_naturreservat_sod',
    upp:   'nv_naturreservat_uppsala',
    ost:   'nv_naturreservat_ostergotland',
    vg:    'nv_naturreservat_vastragotaland',
    skane: 'nv_naturreservat_skane'
  };

  var searchIndex = {};   // module-level so event handler always reads latest version

  // Rebuild search datalist filtered to the selected county.
  // Handles lazy-loading: hidden layers have no features until made visible,
  // so we listen for featuresloadend when the source is empty.
  function rebuildSearch(county) {
    var layerNames = county === 'all'
        ? Object.keys(COUNTY_LAYER_NAME).map(function(k) { return COUNTY_LAYER_NAME[k]; })
        : (COUNTY_LAYER_NAME[county] ? [COUNTY_LAYER_NAME[county]] : []);

    var newIndex = {};
    var pending = 0;

    function finish() {
      searchIndex = newIndex;
      var dl = document.getElementById('reservat-names');
      dl.innerHTML = '';
      Object.keys(newIndex).sort().forEach(function(n) {
        var opt = document.createElement('option');
        opt.value = n;
        dl.appendChild(opt);
      });
    }

    layerNames.forEach(function(lName) {
      var l = findOLLayer(lName);
      if (!l || !l.getSource) return;
      var src = l.getSource();

      function harvest() {
        src.getFeatures().forEach(function(f) {
          var n = f.get('NAMN');
          if (n && !newIndex[n]) newIndex[n] = { feature: f, layerName: lName };
        });
      }

      if (src.getFeatures().length > 0) {
        harvest();
      } else {
        pending++;
        src.once('featuresloadend', function() {
          harvest();
          pending--;
          if (pending === 0) finish();
        });
      }
    });

    if (pending === 0) finish();
  }

  function initSearch() {
    rebuildSearch('all');

    document.getElementById('reservat-search').addEventListener('change', function() {
      var match = searchIndex[this.value];
      if (!match) return;
      // Make sure the matching layer is visible
      var l = findOLLayer(match.layerName);
      if (l && !l.getVisible()) l.setVisible(true);
      var geom = match.feature.getGeometry();
      if (!geom) { this.value = ''; return; }
      viewer.api().getMap().getView().fit(geom.getExtent(), {
        padding: [100, 80, 80, 80],
        duration: 600,
        maxZoom: 13
      });
      this.blur();
      var inp = this;
      setTimeout(function() { inp.value = ''; }, 400);
    });
  }

  // Format AREA_HA with Swedish thousands separator when Origo renders a popup
  (function () {
    function fmtLi(li) {
      var b = li.querySelector('b');
      if (!b || b.textContent.trim() !== 'Areal (ha)') return;
      li.childNodes.forEach(function (n) {
        if (n.nodeType !== 3) return;
        var num = parseFloat(n.textContent.replace(/[^\d.]/g, ''));
        if (!isNaN(num)) n.textContent = ': ' + Math.round(num).toLocaleString('sv-SE') + ' ha';
      });
    }
    function scan(node) {
      if (node.matches && node.matches('li')) fmtLi(node);
      if (node.querySelectorAll) node.querySelectorAll('li').forEach(fmtLi);
    }
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }());
</script>

</body>
</html>
